name: Build TapeDrive Windows VST3

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone Steinberg VST3 SDK
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DVST3_SDK_ROOT="$PWD/external/vst3sdk" `
            -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target JerzyTapeDrive --parallel

      - name: DSP and native GUI regression tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target TapeDriveDSPTests TapeDriveGUITests TapeDriveAutomationTests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --verbose --output-on-failure -R "^(TapeDriveDSP|TapeDriveGUI|TapeDriveAutomation)$"

      - name: Upload GUI render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TapeDrive-GUI-render-evidence
          path: |
            build/tapedrive-render-*.png
            build/tapedrive-window-*.bmp
          if-no-files-found: ignore

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $drive = Get-ChildItem -Path build -Recurse -Directory -Filter "JerzyTapeDrive.vst3" | Select-Object -First 1
          if (-not $drive) { throw "JerzyTapeDrive.vst3 was not produced" }
          Copy-Item -Recurse -Force $drive.FullName artifact/JerzyTapeDrive.vst3
          Compress-Archive -Path artifact/JerzyTapeDrive.vst3 -DestinationPath JerzyTapeDrive_Windows_x64.zip -Force

      - name: Upload Tape Drive
        uses: actions/upload-artifact@v4
        with:
          name: JerzyTapeDrive-Windows-x64
          path: |
            artifact/JerzyTapeDrive.vst3
            JerzyTapeDrive_Windows_x64.zip
          if-no-files-found: error
